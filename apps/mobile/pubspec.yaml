name: callme
description: WebRTC calling app - mobile client
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 2.24.2
  firebase_auth: 4.17.1
  cloud_firestore: 4.14.0
  flutter_webrtc: 0.9.43
  socket_io_client: 2.0.2
  provider: 6.0.0
  get: 4.6.5
  permission_handler: 11.4.4
  flutter_local_notifications: 14.1.1
  intl: 0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.1

flutter:
  uses-material-design: true
