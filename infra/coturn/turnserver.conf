# coTURN TURN Server configuration
# This is a sample configuration file for coTURN TURN server

# LISTENER CONFIGURATION
# ========================

# UDP listener port
listening-port=3478

# TCP listener port
listening-port=3478

# TLS listener port (requires certificate)
tls-listening-port=5349

# Listening IP addresses
listening-ip=0.0.0.0

# Relay addresses (where TURN traffic appears to come from)
relay-ip=0.0.0.0

# REALM AND CREDENTIALS
# ========================

# TURN realm (set from env variable TURN_REALM or use default)
realm=example.com

# Static authentication secret for time-limited credentials
static-auth-secret=your-secret-key

# Enable static authentication secret mechanism
use-auth-secret

# Disable legacy auth mechanism
lt-cred-mech

# PORT ALLOCATION
# ========================

# Minimum port for relay allocation
min-port=49152

# Maximum port for relay allocation
max-port=65535

# SECURITY AND PERFORMANCE
# ========================

# Enable fingerprint (for DTLS)
fingerprint

# Per-user bandwidth limit in bytes per second (1 Mbps = 1000000 bps)
bps-capacity=1000000

# Maximum concurrent connections per user
user-quota=100

# Maximum total concurrent connections
max-bps=0

# LOGGING
# ========================

# Log file path
log-file=/var/log/coturn/coturn.log

# Log level (min, normal, verbose)
log-file-level=verbose

# PID file
pidfile=/var/run/coturn/turnserver.pid

# ADDITIONAL SETTINGS
# ========================

# Enable server behind NAT
behind-nat

# Verbose logging
verbose

# External IP address (set from env or auto-detect)
# external-ip=YOUR_PUBLIC_IP/YOUR_PRIVATE_IP
